# 評価クエリと関連度ラベル。
#
# qrels をルールで表現しているのは、対象PDFのチャンク分割結果が chunk_size /
# overlap の設定で変わるため、chunk_id を直接書くと再現できないから。
# 等級は 3=直接の根拠（具体的な数値を伴う） / 2=部分的な根拠（主題と論点は
# 合うが数値がない） / 1=話題は重なるが根拠にならない。
#
# ルールのキー:
#   all   すべて含む / any  1つ以上含む / none  1つも含まない
#   regex 正規表現に一致する（all/any とはAND）
#
# grade 3 に regex を付けているのは、統計白書では「%」という記号だけなら
# ほぼ全ページに現れ、主題語を含むチャンクの大半が「直接の根拠」に昇格して
# しまい strict_ndcg が機能しなくなるため。数値を伴う実績値だけを拾う。
# 本文は取り込み時に NFKC 正規化されるので、全角の ％ や ＡＩ は書き分け不要。
#
# 注意: 以下のルールは白書の一般的な語彙を前提に書いた初期値で、実データでは
# 未検証。取り込み後に `jev-rag labels` で「該当なし」と「過剰マッチ」の
# 両方を確認し、対象文書に合わせて調整すること。
queries:
  - query_id: q01
    question: 生成AIの利用率は前年と比べてどう変化したか
    rules:
      - {all: ["生成AI"], any: ["利用率", "利用状況", "利用経験"], regex: '[0-9]+(\.[0-9]+)?\s*%', grade: 3}
      - {all: ["生成AI"], any: ["利用率", "利用状況", "利用経験"], grade: 2}
      - {all: ["生成AI"], grade: 1}

  - query_id: q02
    question: 企業が生成AIを導入する際の課題として何が挙げられているか
    rules:
      - {all: ["生成AI"], any: ["課題", "懸念", "阻害", "リスク"], regex: '[0-9]+(\.[0-9]+)?\s*%', grade: 3}
      - {all: ["生成AI"], any: ["課題", "懸念", "阻害", "リスク"], grade: 2}
      - {all: ["生成AI"], any: ["企業", "導入"], grade: 1}

  - query_id: q03
    question: 個人のインターネット利用率は何％か
    rules:
      - {all: ["インターネット"], any: ["利用率", "利用者"], regex: '[0-9]+(\.[0-9]+)?\s*%', grade: 3}
      - {all: ["インターネット"], any: ["利用率", "利用者"], grade: 2}
      - {all: ["インターネット"], grade: 1}

  - query_id: q04
    question: 情報通信産業の市場規模はどの程度か
    rules:
      - {any: ["市場規模", "名目国内生産額", "産業規模"], regex: '[0-9]+(\.[0-9]+)?\s*(兆|億|%)', grade: 3}
      - {any: ["市場規模", "名目国内生産額", "産業規模"], grade: 2}
      - {all: ["情報通信産業"], grade: 1}

  - query_id: q05
    question: 偽・誤情報への対応として何が示されているか
    rules:
      - {any: ["偽情報", "誤情報", "偽・誤情報"], regex: '対応|対策|取組|求められ', grade: 3}
      - {any: ["偽情報", "誤情報", "偽・誤情報"], grade: 2}
      - {any: ["信頼性", "リテラシー"], grade: 1}

  - query_id: q06
    question: データ流通量やトラヒックはどれくらい増加しているか
    rules:
      - {any: ["トラヒック", "トラフィック", "通信量", "データ流通量"], regex: '[0-9]+(\.[0-9]+)?\s*(%|Tbps|Gbps|倍|ポイント)', grade: 3}
      - {any: ["トラヒック", "トラフィック", "通信量", "データ流通量"], grade: 2}
      - {any: ["ブロードバンド", "回線"], grade: 1}

  - query_id: q07
    question: AI人材の不足について何が書かれているか
    rules:
      - {all: ["人材"], any: ["不足", "確保", "育成"], regex: '[0-9]+(\.[0-9]+)?\s*%', grade: 3}
      - {all: ["人材"], any: ["不足", "確保", "育成"], grade: 2}
      - {all: ["人材"], grade: 1}

  - query_id: q08
    question: 諸外国と比較した日本の生成AI利用状況の特徴は
    rules:
      - {all: ["生成AI"], any: ["諸外国", "国際比較", "米国", "中国", "ドイツ"], regex: '[0-9]+(\.[0-9]+)?\s*%', grade: 3}
      - {all: ["生成AI"], any: ["諸外国", "国際比較", "米国", "中国", "ドイツ"], grade: 2}
      - {all: ["生成AI"], grade: 1}
