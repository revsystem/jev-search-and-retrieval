# 評価クエリと関連度ラベル。
#
# 対象は総務省『情報通信白書』令和8年版 第1章「個人におけるAI利用」
# (n1110000.pdf、全15ページ)。本文は取り込み時に NFKC 正規化と、装飾用の
# 字間・二重描画・柱の除去を経るので、ルールは正規化後の表記で書く。
#
# qrels をルールで表現しているのは、チャンク分割の設定を変えると chunk_id が
# 変わり、直接書くと再現できないから。等級は 3=直接の根拠（具体的な数値を
# 伴う） / 2=部分的な根拠（主題と論点は合うが数値がない） / 1=話題は重なるが
# 根拠にならない。
#
# ルールのキー: all(すべて含む) / any(1つ以上) / none(含まない) / regex(AND)
#
# grade 3 の条件は実測にもとづいて決めた。
# 単位「%」ではなく小数を要求するのは、この文書の図表から抽出される数値に
# 単位が付かないため(「利用頻度」「リスク」「利用目的」を含むチャンクの
# % ヒットは0件、小数のヒットは 3/3・5/6・1/1 件)。
# min_sentences を併用するのは、小数が37チャンク中33件に現れて識別力が
# ないため。図表を丸ごと抽出したチャンクは数値を持つが句点を持たず
# (。/100字 = 0.00)、本文は 0.4〜1.2 と明確に分かれる。生成モデルが根拠
# として引用できるのは後者なので、3文以上を直接の根拠の条件とした。
#
# 語彙は実際に取り込んだ37チャンクを調べて選んだ。`jev-rag labels` で
# 「該当なし」と「過剰マッチ」の両方向を確認しながら較正している。
queries:
  - query_id: q01
    question: 日本における生成AIサービスの利用経験率は前年からどう変化したか
    rules:
      - {all: ["利用経験"], any: ["前年", "2024年度", "上昇"], regex: '[0-9]+\.[0-9]+', min_sentences: 3, grade: 3}
      - {all: ["生成AI", "利用経験"], grade: 2}
      - {all: ["生成AI"], grade: 1}

  - query_id: q02
    question: 米国・ドイツ・中国と比べて日本の生成AI利用経験率はどの水準か
    rules:
      - {all: ["生成AI", "利用経験"], any: ["米国", "ドイツ", "中国"], regex: '[0-9]+\.[0-9]+', min_sentences: 3, grade: 3}
      - {all: ["生成AI"], any: ["米国", "ドイツ", "中国"], grade: 2}
      - {all: ["生成AI"], grade: 1}

  - query_id: q03
    question: 生成AIサービスを利用しない理由として何が挙げられているか
    rules:
      - {all: ["利用しない"], regex: '[0-9]+\.[0-9]+', min_sentences: 3, grade: 3}
      - {all: ["利用しない"], grade: 2}
      - {any: ["理由"], grade: 1}

  - query_id: q04
    question: 年齢階層によって生成AIの利用状況はどう違うか
    rules:
      - {any: ["年齢階層", "若年層"], regex: '[0-9]+\.[0-9]+', min_sentences: 3, grade: 3}
      - {any: ["年齢階層", "若年層", "年齢別"], grade: 2}
      - {any: ["年齢"], grade: 1}

  - query_id: q05
    question: 生成AIサービスの利用頻度はどの程度か
    rules:
      - {all: ["利用頻度"], regex: '[0-9]+\.[0-9]+', min_sentences: 3, grade: 3}
      - {all: ["利用頻度"], grade: 2}
      - {any: ["頻度"], grade: 1}

  - query_id: q06
    question: 生成AIはどのような目的で利用されているか
    rules:
      - {any: ["利用目的", "目的別"], regex: '[0-9]+\.[0-9]+', min_sentences: 3, grade: 3}
      - {any: ["利用目的", "目的別"], grade: 2}
      - {any: ["相談", "翻訳"], grade: 1}

  - query_id: q07
    question: AIの利用に対してどのようなリスク意識が示されているか
    rules:
      - {all: ["リスク"], regex: '[0-9]+\.[0-9]+', min_sentences: 3, grade: 3}
      - {all: ["リスク"], grade: 2}
      - {any: ["意識", "感覚"], grade: 1}

  - query_id: q08
    question: 人々はAIをどのような存在にたとえているか
    rules:
      - {any: ["秘書", "カウンセラー"], regex: '[0-9]+\.[0-9]+', grade: 3}
      - {any: ["秘書", "カウンセラー"], grade: 2}
      - {any: ["役割"], grade: 1}
