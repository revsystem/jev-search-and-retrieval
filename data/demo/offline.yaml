# オフラインデモ用の合成コーパスと、台本化したJevの判定値。
#
# 重要: ここに書かれた jev.relevance / jev.score は Jev が実際に返した値では
# なく、「System One が正しく判定した場合に返るであろう値」を手で書いたもの。
# したがってこのデモが示すのは比較ハーネスの配線が正しく動くことだけで、
# Jev の実力を示す証拠ではない。実測は AI Gateway か TypeSafe API を繋いで
# `jev-rag evaluate` で行うこと。
#
# コーパスは「語彙は重なるが根拠にならない断片」が語彙一致で上位に来る、
# 実運用でよくある失敗形を再現するように作ってある。
