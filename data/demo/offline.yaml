    topic: economy
    text: 企業が生成AIを導入する際の課題としては、社内のノウハウ不足を挙げる企業が48.2%と最も多く、次いで情報漏えいへの不安が41.5%であった。
  - chunk_id: c07
    page: 6
    section: 第2節　企業におけるICT利活用
