[project]
name = "jev-rag-comparison"
version = "0.1.0"
description = "Comparison harness for classic RAG / reranking versus TypeSafe Jev (System One) assisted search and retrieval on Amazon Bedrock + S3 Vectors"
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.40.0",
    "httpx>=0.27.0",
    "pypdf>=5.0.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[project.scripts]
jev-rag = "jev_rag.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jev_rag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
# Mirrored upstream documentation is kept verbatim; ruff reformats the Python
# code blocks inside Markdown, which would silently rewrite the source we are
# checking the implementation against.
extend-exclude = [".claude/docs/research"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
